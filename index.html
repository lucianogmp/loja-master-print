<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Master Print — Gráfica online</title>
    <meta name="description" content="Cartões de visita, adesivos, banners, impressos, placas e quadros personalizados." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icones/icone-180.png" />
    <link rel="manifest" href="/api/manifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    />
    <script>
      // Aplica o tema antes de a página aparecer, para não piscar claro/escuro.
      // Mesma chave e mesma regra do ERP: tema salvo, senão o do aparelho.
      (function () {
        try {
          var t = localStorage.getItem('master-print-theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'dark' ? '#0f172a' : '#f8fbff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
